# Construit l'APK de l'appli Android d'Arsenal (docs/android.md) et le
# dépose en « artefact », à télécharger depuis l'onglet Actions de GitHub.
#
# Tourne sur chaque pull request qui touche l'appli, et sur main.
# Indépendant du workflow « CI » : il ne le ralentit pas.
#
# Secrets du dépôt utilisés s'ils existent (Settings → Secrets and
# variables → Actions) :
#   ARSENAL_CLE_BASE64    la clé de signature (.jks), encodée en base64 ;
#   ARSENAL_CLE_MDP       son mot de passe ;
#   ARSENAL_DOS_DE_CARTE  le vrai dos de carte (image), encodé en base64.
# Sans la clé, l'APK est signé avec une clé de débogage jetable : il
# s'installe, mais une mise à jour demandera de désinstaller.
name: Android

on:
  pull_request:
    paths:
      - "crates/android/**"
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: gradle/actions/setup-gradle@v4
      - name: Outils
        run: |
          cargo ndk --version || cargo install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Dos de carte (secret)
        env:
          DOS: ${{ secrets.ARSENAL_DOS_DE_CARTE }}
        run: |
          if [ -z "$DOS" ]; then
            echo "Pas de secret ARSENAL_DOS_DE_CARTE : dos de carte de remplacement."
            exit 0
          fi
          mkdir -p data/outils
          echo "$DOS" | base64 -d > "$RUNNER_TEMP/dos"
          case "$(file --mime-type -b "$RUNNER_TEMP/dos")" in
            image/webp) ext=webp ;;
            image/png) ext=png ;;
            image/jpeg) ext=jpg ;;
            *) echo "::error::ARSENAL_DOS_DE_CARTE n'est pas une image webp, png ou jpg."; exit 1 ;;
          esac
          mv "$RUNNER_TEMP/dos" "data/outils/dos-de-carte.$ext"
          echo "Vrai dos de carte embarqué ($ext)."
      - name: Clé de signature (secret)
        env:
          CLE: ${{ secrets.ARSENAL_CLE_BASE64 }}
          MDP: ${{ secrets.ARSENAL_CLE_MDP }}
        run: |
          if [ -z "$CLE" ] || [ -z "$MDP" ]; then
            echo "::warning::Pas de clé de signature dans les secrets : APK signé avec une clé de débogage jetable."
            exit 0
          fi
          echo "$CLE" | base64 -d > "$RUNNER_TEMP/arsenal.jks"
          echo "ARSENAL_CLE=$RUNNER_TEMP/arsenal.jks" >> "$GITHUB_ENV"
          echo "ARSENAL_CLE_MDP=$MDP" >> "$GITHUB_ENV"
      - name: APK
        env:
          CIBLES: arm64-v8a
          ARSENAL_VERSION: ${{ github.run_number }}
        run: |
          bash android/construire.sh
          cp android/app/build/outputs/apk/release/app-release.apk "arsenal-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: arsenal-${{ github.run_number }}
          path: arsenal-${{ github.run_number }}.apk
          retention-days: 30
