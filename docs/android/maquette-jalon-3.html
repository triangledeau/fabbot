<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette Arsenal téléphone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Sofia+Sans+Semi+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  --bg: #0a0d13; --mat: #0e1219; --surface: #121722; --surface2: #171d2a;
  --ink: #efe5cf; --muted: #a9a595; --line: rgb(239 229 207 / .28); --line2: rgb(239 229 207 / .14);
  --brass: #ffd84a; --red: #e0574a; --blue: #4f8fe0; --good: #63c98b; --mc: #c9a24a; --oc: #c9483c;
  --f-display: "Cinzel", Georgia, serif;
  --f-body: "Sofia Sans Semi Condensed", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: #222; color: var(--ink); font: 15px/1.3 var(--f-body); }
.planche { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; }
.tel { width: 412px; height: 851px; background: var(--bg); position: relative; overflow: hidden; flex: none; }
.leg { width: 412px; color: #ccc; font-size: 13px; margin-top: 6px; }
.btn { font: 600 15px var(--f-body); color: var(--ink); background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.pri { background: var(--ink); color: #14110c; border-color: var(--ink); }
.btn.ico { width: 44px; padding: 0; }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ---------- Accueil ---------- */
.acc { padding: 10px 12px; display: flex; flex-direction: column; height: 100%; gap: 10px; }
.acc .logo { text-align: center; }
.acc .logo small { display: block; font: 600 11px var(--f-display); letter-spacing: .25em; color: var(--brass); }
.acc .logo b { font: 800 34px var(--f-display); letter-spacing: .06em; background: linear-gradient(#f4e2b0, #a87a2a); -webkit-background-clip: text; color: transparent; }
.tuile { border: 1px solid var(--c); border-radius: 14px; background: var(--surface); overflow: hidden; flex: none; }
.tuile .art { height: 146px; background-size: cover; position: relative; }
.tuile .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, var(--surface)); }
.tuile h2 { position: absolute; left: 14px; bottom: 2px; margin: 0; z-index: 1; font: 800 24px var(--f-display); font-variant: small-caps; text-shadow: 0 2px 6px #000; }
.tuile ul { margin: 0; padding: 2px 14px 10px 30px; font-size: 14px; color: #d8d2c0; columns: 1; }
.tuile ul li { margin: 1px 0; }
.tuile ul li::marker { color: var(--c); }
.tuile .bas { margin: 0 10px 10px; padding: 6px 6px 6px 12px; border: 1px solid var(--line2); border-radius: 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.tuile .bas span { flex: 1; }

/* ---------- Decks ---------- */
.dk-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line2); }
.dk-h h1 { font: 800 20px var(--f-display); margin: 0; flex: 1; }
.chips { display: flex; gap: 8px; padding: 8px 10px; overflow: hidden; }
.chips .btn { flex: 1 1 auto; font-size: 14px; white-space: nowrap; flex: none; }
.sec { font: 600 11px var(--f-display); letter-spacing: .16em; color: var(--muted); padding: 8px 12px 4px; }
.liste { padding: 0 10px; display: flex; flex-direction: column; gap: 6px; }
.dk { height: 66px; display: flex; align-items: stretch; border: 1px solid var(--line2); border-left: 3px solid var(--c); border-radius: 10px; background: var(--surface); overflow: hidden; }
.dk.sel { border-color: var(--brass); border-left-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.visage { width: 66px; flex: none; position: relative; overflow: hidden; }
.visage img { position: absolute; }
.dk .tx { flex: 1; min-width: 0; padding: 7px 4px 6px 10px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.dk .tx b { font: 800 17px var(--f-display); font-variant: small-caps; line-height: 1.05; }
.dk .tx .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dk .pl { display: flex; gap: 4px; }
.pill { font-size: 11px; border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; color: var(--muted); }
.pill.ok { color: var(--good); border-color: rgb(99 201 139 / .5); }
.dk .more { width: 44px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 22px; }
.dk.newd { border-style: dashed; border-left-width: 1px; align-items: center; padding-left: 14px; gap: 14px; color: var(--muted); }
.dk.newd .plus { font-size: 30px; color: var(--brass); width: 38px; text-align: center; }
.duel { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 14px); padding: 18px 10px 10px; }
.duel .bloc { border: 1px solid var(--line); background: var(--surface2); border-radius: 14px; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.duel .sel2 { border: 1px solid var(--line2); border-radius: 10px; padding: 3px 10px; font-size: 12px; color: var(--muted); min-height: 44px; }
.duel .sel2 b { display: block; color: var(--ink); font-size: 15px; }
.duel .btn.pri { grid-column: 1 / -1; font-size: 17px; min-height: 48px; }

/* ---------- Partie ---------- */
.p { display: flex; flex-direction: column; height: 100%; background:
  radial-gradient(ellipse 90% 40% at 50% 18%, rgb(201 72 60 / .14), transparent),
  radial-gradient(ellipse 90% 40% at 50% 78%, rgb(201 162 74 / .12), transparent), var(--bg); }
.barre { height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; border-bottom: 1px solid var(--line2); }
.barre .sc { flex: 1; text-align: center; font-size: 13px; line-height: 1.15; }
.barre .sc b { font: 700 15px var(--f-num); color: var(--brass); }
.barre .btn { border: 0; background: none; }
.etat { height: 26px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 12.5px; color: var(--muted); }
.etat .g { display: flex; align-items: center; gap: 3px; }
.res { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--mc); display: grid; place-items: center; font: 600 11px var(--f-num); color: var(--brass); }
.ap { width: 15px; height: 15px; transform: rotate(45deg); border: 1.5px solid var(--mc); background: rgb(255 216 74 / .25); }
.ap.off { background: none; opacity: .5; }
.etat .perm { display: flex; gap: 3px; margin-left: auto; align-items: center; }
.etat .perm .c { width: 20px; height: 28px; border-radius: 2px; }
.etat .fx { color: #9fd3a8; border: 1px solid rgb(99 201 139 / .4); border-radius: 99px; padding: 0 7px; font-size: 11.5px; }
.mainbot { display: flex; align-items: center; gap: 4px; }
.mainbot i { width: 11px; height: 16px; border-radius: 2px; background: #3a2020; border: 1px solid #7a4040; display: inline-block; margin-left: -5px; }

.tapis { flex: none; display: grid; grid-template-columns: 119px 58px 58px 119px; justify-content: space-between; padding: 0 6px; }
.tapis.bot { direction: rtl; }
.tapis .g2 { display: grid; grid-template-columns: 58px 58px; gap: 3px; }
.tapis .g1 { display: grid; grid-template-rows: 81px 81px; gap: 3px; }
.tapis.bot .g2, .tapis.bot .g1 { direction: ltr; }
.z { width: 58px; height: 81px; border: 1px solid var(--line2); border-radius: 5px; position: relative; display: grid; place-items: center; }
.z .lib { font: 600 8.5px var(--f-display); letter-spacing: .08em; color: rgb(239 229 207 / .45); text-transform: uppercase; }
.z .c { position: absolute; inset: 0; }
.c { background-size: cover; background-position: center; border-radius: 4px; box-shadow: 0 1px 4px #000; }
.z .n { position: absolute; right: -3px; top: -5px; z-index: 2; font: 600 11px var(--f-num); background: #000c; border: 1px solid var(--line); border-radius: 99px; padding: 0 5px; }
.z.heros { border-color: var(--mc); }
.tapis.bot .z.heros { border-color: var(--oc); }
.pv { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); z-index: 2; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(#2a2418, #0d0b07); border: 2px solid var(--mc); display: grid; place-items: center; font: 700 17px var(--f-num); color: #fff3cc; }
.tapis.bot .pv { bottom: auto; top: -7px; border-color: var(--oc); }
.dos { background: radial-gradient(circle at 50% 50%, #c33 0 18%, transparent 19%), linear-gradient(#2b1717, #170c0c); border: 1px solid #5a3030; }
.pitchf { position: absolute; inset: 0; }
.pitchf .c { position: absolute; width: 58px; height: 81px; }
.prio { box-shadow: 0 0 0 2px var(--brass), 0 0 14px rgb(255 216 74 / .5); }

.centre { flex: 1; min-height: 0; margin: 6px 6px; border-top: 1px solid rgb(201 72 60 / .45); border-bottom: 1px solid rgb(201 162 74 / .45); display: flex; flex-direction: column; position: relative; }
.ticker { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); padding: 4px 2px 0; white-space: nowrap; overflow: hidden; }
.ticker .t { flex: none; font: 600 11px var(--f-display); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.ticker .der { overflow: hidden; text-overflow: ellipsis; }
.etapes { display: flex; gap: 8px; font: 600 9.5px var(--f-display); letter-spacing: .06em; color: rgb(239 229 207 / .35); padding: 3px 2px; text-transform: uppercase; }
.etapes .on { color: var(--brass); border-bottom: 2px solid var(--brass); }
.etapes .done { color: rgb(239 229 207 / .6); }
.chaine { flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 2px; min-height: 0; }
.vieux { display: flex; flex-direction: column; gap: 4px; }
.vieux .c { width: 34px; height: 48px; opacity: .65; }
.maillon { display: flex; align-items: center; gap: 8px; }
.maillon .att { width: 78px; height: 109px; box-shadow: 0 0 0 2px var(--oc), 0 0 16px rgb(201 72 60 / .5); }
.clash { text-align: center; font-family: var(--f-display); }
.clash small { display: block; font-size: 9px; letter-spacing: .1em; color: var(--muted); }
.clash b { display: block; font: 700 30px var(--f-num); line-height: 1; }
.clash .a { color: var(--brass); } .clash .d { color: #cfe3ff; }
.clash hr { border: 0; border-top: 1px solid var(--line); margin: 3px 4px; }
.defs { display: flex; gap: 3px; }
.defs .c { width: 48px; height: 67px; }
.defs .c.tente { box-shadow: 0 0 0 2px var(--blue); }
.pile { margin-left: auto; width: 116px; align-self: stretch; border-left: 1px solid var(--line2); padding: 2px 0 2px 6px; display: flex; flex-direction: column; gap: 4px; }
.pile .lab { font: 600 10px var(--f-display); letter-spacing: .12em; color: var(--muted); }
.couche { display: flex; gap: 5px; align-items: center; font-size: 12px; line-height: 1.1; background: var(--surface2); border: 1px solid var(--line2); border-radius: 6px; padding: 3px; }
.couche .c { width: 26px; height: 36px; flex: none; }
.couche.haut { border-color: var(--brass); }
.chainevide { flex: 1; display: grid; place-items: center; color: rgb(239 229 207 / .3); font: 600 13px var(--f-display); letter-spacing: .12em; }

.main { flex: none; height: 128px; position: relative; display: flex; justify-content: center; padding: 6px 6px 0; }
.main .c { width: 80px; height: 112px; margin: 0 -6px; border-radius: 5px; position: relative; }
.main .c.jouable { box-shadow: 0 0 0 2px var(--brass), 0 0 10px rgb(255 216 74 / .45); z-index: 1; }
.main .c.leve { transform: translateY(-10px); }
.main .lab { position: absolute; left: 8px; top: 2px; font: 600 9.5px var(--f-display); letter-spacing: .12em; color: var(--muted); }
.ruban { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding: 7px 8px 8px; }
.ruban .q { font-size: 14px; margin-bottom: 6px; }
.ruban .q b { color: var(--brass); }
.ruban .bs { display: flex; gap: 6px; }
.ruban .bs .btn { flex: 1; min-height: 46px; }
.ruban .bs .btn.ico { flex: none; width: 46px; }

/* fiche (carte focus) */
.voile { position: absolute; inset: 0; background: rgb(5 7 10 / .72); z-index: 10; }
.fiche { position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--surface); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 8px 14px 12px; }
.fiche .poignee { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
.fiche .grande { width: 250px; height: 349px; margin: 0 auto; border-radius: 12px; box-shadow: 0 6px 30px #000; }
.fiche h3 { margin: 10px 0 2px; font: 800 19px var(--f-display); text-align: center; }
.fiche .ty { text-align: center; color: var(--muted); font-size: 13.5px; }
.fiche .txt { margin: 8px 0 10px; font-size: 14.5px; line-height: 1.35; background: var(--surface2); border-radius: 10px; padding: 8px 10px; }
.fiche .bs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fiche .bs .btn { min-height: 48px; }

/* journal */
.tiroir { position: absolute; top: 0; bottom: 0; right: 0; width: 86%; z-index: 11; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.tiroir .hd { display: flex; align-items: center; padding: 6px 6px 6px 14px; border-bottom: 1px solid var(--line2); }
.tiroir .hd h3 { flex: 1; margin: 0; font: 800 18px var(--f-display); }
.tiroir .corps { padding: 6px 14px; overflow: hidden; font-size: 14px; }
.tiroir .tr { font: 600 11px var(--f-display); letter-spacing: .12em; color: var(--brass); margin: 10px 0 4px; }
.tiroir p { margin: 3px 0; }
.tiroir p.bot { color: #f0b8ae; }
.tiroir .pied { margin-top: auto; padding: 10px 14px; border-top: 1px solid var(--line2); display: grid; gap: 8px; }
.menu { position: absolute; left: 6px; top: 46px; z-index: 11; width: 260px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: grid; gap: 2px; }
.menu .btn { justify-content: flex-start; border: 0; background: none; }
.menu hr { border: 0; border-top: 1px solid var(--line2); margin: 3px 0; }

/* ===== version 2 (retour d'Antoine du 2026-11-28) ===== */
.liste { gap: 5px; }
.dk { height: 50px; position: relative; border-left: 1px solid var(--line2); background: var(--surface); }
.dk.sel { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.dk .fondu { position: absolute; left: 0; top: 0; bottom: 0; width: 200px; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 60px, rgb(0 0 0 / .55) 120px, transparent 196px); mask-image: linear-gradient(to right, #000 60px, rgb(0 0 0 / .55) 120px, transparent 196px); }
.dk .fondu img { position: absolute; }
.dk .tx { position: relative; padding: 0 4px 0 118px; gap: 0; }
.dk .tx b { font-size: 17px; text-shadow: 0 1px 4px #000, 0 0 10px #000; }
.dk .tx .sub { font-size: 12px; text-shadow: 0 1px 3px #000; color: #c9c3b2; }
.dk .ic { position: relative; flex: none; width: 34px; display: flex; align-items: center; justify-content: center; }
.dk .ic svg { width: 28px; height: 28px; }
.dk .more { position: relative; width: 40px; }
.dk .compte { position: relative; align-self: center; font: 600 11px var(--f-num); color: #f0b04a; border: 1px solid rgb(240 176 74 / .5); border-radius: 99px; padding: 0 5px; }
.dk.newd { height: 44px; }

.tapis { grid-template-columns: 109px 165px 109px; }
.tapis .g2 { grid-template-columns: 53px 53px; }
.tapis .g3 { display: grid; grid-template-columns: 53px 53px 53px; grid-template-rows: 74px 74px; gap: 3px; }
.tapis.bot .g3 { direction: ltr; }
.z { width: 53px; height: 74px; }
.z.rien { border: 0; }
.pitchf .c { width: 53px; height: 74px; }
.pv { width: 32px; height: 32px; font-size: 16px; }

.rangee { flex: none; display: flex; gap: 6px; padding: 0 6px; }
.rangee .main { flex: 1; min-width: 0; height: 122px; justify-content: flex-start; padding: 6px 0 0 6px; }
.rangee .main .c { width: 72px; height: 100px; margin: 0 -8px 0 0; }
.perms { width: 142px; flex: none; display: grid; grid-template-columns: repeat(3, 42px); grid-auto-rows: 58px; gap: 6px 8px; align-content: start; padding-top: 6px; }
.perms .pc { position: relative; }
.perms .pc .c { width: 42px; height: 58px; position: absolute; inset: 0; }
.perms .x { position: absolute; right: -6px; bottom: -5px; z-index: 2; font: 700 12px var(--f-num); color: #14110c; background: var(--ink); border-radius: 99px; padding: 0 5px; box-shadow: 0 1px 3px #000; }
.perms .plus { display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 5px; font: 600 13px var(--f-body); color: var(--muted); }
.perms .aucun { grid-column: 1 / -1; color: rgb(239 229 207 / .35); font-size: 12px; border: 1px dashed var(--line2); border-radius: 8px; padding: 18px 6px; text-align: center; grid-row: span 2; }
.rangee.bot { height: 66px; align-items: flex-start; padding-top: 3px; }
.rangee.bot .perms { width: auto; flex: 1; grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 38px; grid-template-rows: 53px; grid-auto-rows: auto; gap: 8px; padding: 0; }
.rangee.bot .perms .pc .c { width: 38px; height: 53px; }
.mainbot2 { flex: none; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.mainbot2 .dosm { display: flex; }
.mainbot2 .dosm i { width: 24px; height: 34px; border-radius: 3px; margin-left: -12px; box-shadow: -1px 0 3px #000; }
.etat .fxs { margin-left: auto; display: flex; gap: 4px; min-width: 0; }
.etat .fx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
.etat .fx.mal { color: #f0b8ae; border-color: rgb(224 87 74 / .45); }
.z .lib { font-size: 7.5px; letter-spacing: .02em; }
.rangee.bot .perms .aucun { grid-row: auto; padding: 6px 12px; white-space: nowrap; align-self: center; }
</style>
</head>
<body>
<div class="planche" id="planche"></div>
<script>
const IMG = (c, t = "normal") => `https://legendstory-production-s3-public.s3.amazonaws.com/media/cards/${t}/${c}.webp`;
const C = (code, cls = "", st = "") => `<div class="c ${cls}" style="background-image:url('${IMG(code)}');${st}"></div>`;
const VIS = {FR_IRA001:[.47,.22],FR_MPW004:[.50,.25],FR_SDO001:[.46,.24],FR_SBR001:[.40,.30],FR_SIY001:[.48,.23],FR_ROS002:[.36,.22],FR_IAR002:[.46,.26],UPR002:[.50,.27],FR_SAR001:[.47,.25],FR_ROS008:[.49,.28]};
// Point entre les yeux, en fraction de la carte (546 × 763), noté à la main.
const YEUX = {FR_IRA001:[.50,.205],FR_MPW004:[.437,.225],FR_SDO001:[.55,.212],FR_SBR001:[.436,.295],FR_SIY001:[.543,.199],FR_ROS002:[.436,.234],FR_IAR002:[.50,.225],UPR002:[.50,.245],FR_SAR001:[.38,.238],FR_ROS008:[.565,.244]};
// Illustration fondue sur la gauche de la tuile : la carte affichée à 420 points
// de large (zoom ×2 environ sur l'écran du Pixel 9), yeux à 60 points du bord.
function fondu(code, h = 50) {
  const [x, y] = YEUX[code] || [.5, .22];
  const W = 420, H = W * 763 / 546;
  return `<div class="fondu"><img src="${IMG(code, "large")}" style="width:${W}px;height:${H}px;left:${60 - x * W}px;top:${h / 2 - y * H}px" alt=""></div>`;
}
const ROBOT = '<svg viewBox="0 0 32 32" aria-label="réglé pour le bot"><path d="M16 3v4" stroke="#63c98b" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="3" r="1.8" fill="#63c98b"/><rect x="5" y="8" width="20" height="16" rx="5" fill="none" stroke="#63c98b" stroke-width="2"/><circle cx="11.5" cy="15" r="2.2" fill="#63c98b"/><circle cx="18.5" cy="15" r="2.2" fill="#63c98b"/><path d="M11 20h8" stroke="#63c98b" stroke-width="2" stroke-linecap="round"/><path d="M2.5 13v5M27.5 13v1" stroke="#63c98b" stroke-width="2" stroke-linecap="round"/><circle cx="25" cy="24" r="6" fill="#63c98b"/><path d="M22.2 24.2l2 2 3.8-4" fill="none" stroke="#0a0d13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// Vignette « visage » : la carte agrandie pour qu'un carré de 34 % de sa largeur remplisse la vignette.
function visage(code, t = 66) {
  const [x, y] = VIS[code] || [.48, .23];
  const W = t / .34, H = W * 763 / 546;
  return `<div class="visage"><img src="${IMG(code, "large")}" style="width:${W}px;height:${H}px;left:${t / 2 - x * W}px;top:${t / 2 - y * H}px" alt=""></div>`;
}
const I = {
  menu: '<svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
  journal: '<svg class="i" viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v16H8a2 2 0 0 1-2-2z"/><path d="M6 19a2 2 0 0 1 2-2h11M10 8h6M10 12h6"/></svg>',
  annuler: '<svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
  maison: '<svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  fermer: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};
const ecrans = [];
const tel = (html, leg) => ecrans.push(`<div><div class="tel">${html}</div><div class="leg">${leg}</div></div>`);

// ---------- 1. Accueil ----------
const ART = (c, pos) => `background-image:url('${IMG(c, "large")}');background-size:130%;background-position:${pos}`;
tel(`<div class="acc">
  <div class="logo"><small>FLESH AND BLOOD · SILVER AGE</small><b>ARSENAL</b></div>
  <div class="tuile" style="--c:#c9483c"><div class="art" style="${ART("FR_SDO001", "50% 22%")}"><h2>Jouer</h2></div>
    <ul><li>Affronter le bot</li><li>Créer et modifier tes decks</li><li>Imprimer un deck (proxies)</li></ul>
    <div class="bas"><span>Hala — Dorinthea <b>0–0</b></span><button class="btn pri">Reprendre</button><button class="btn">Nouveau</button></div></div>
  <div class="tuile" style="--c:#4f8fe0"><div class="art" style="${ART("FR_IRA001", "50% 24%")}"><h2>Apprendre</h2></div>
    <ul><li>Didacticiel : les règles pas à pas</li><li>Puzzles de value (à venir)</li></ul></div>
  <div class="tuile" style="--c:#e6b422"><div class="art" style="${ART("FR_SBR001", "40% 30%")}"><h2>Entraîner</h2></div>
    <ul><li>Tournoi des bots, decks contre decks</li><li>Comparer deux niveaux de bot</li></ul>
    <div class="bas"><span>Dernier tournoi : aucun</span></div></div>
</div>`, "1. Accueil : les trois tuiles tiennent sans défilement (illustration plus basse, titre posé dessus).");

// ---------- 2. Jouer : choix des decks ----------
const DECKS = [["Ira","Ira, Crimson Haze · Sunday Showdown: Sydney 2nd","FR_IRA001","#e0563f"],["Hala","Hala · Sunday Showdown: Sydney 5th","FR_MPW004","#c9483c"],["Dorinthea","Dorinthea · Sunday Showdown: Mexico City 1st","FR_SDO001","#c9483c"],["Bravo","Bravo, Flattering Showman · Sunday Showdown: Mexico City 3rd","FR_SBR001","#d08a2a"],["Iyslander","Iyslander · SAGE Rabblelander","FR_SIY001","#6fd0e6"],["Florian","Florian · Sunday Showdown: Bangkok 2nd","FR_ROS002","#9a6bd1"],["Levia","Levia · Sunday Showdown: Atlanta 5th","FR_IAR002","#b0653a"],["Dromai","Dromai · Sunday Showdown: Paris 5th","UPR002","#e0782f"],["Arakni","Arakni, Web of Deceit · Sunday Showdown: Jakarta 5th","FR_SAR001","#8a5bc8"],["Aurora","Aurora · Sunday Showdown: Sydney 5th","FR_ROS008","#6fd0e6"]];
const tuileDeck = ([n, s, c, col, compte], sel) => `<div class="dk${sel ? " sel" : ""}" style="--c:${col}">${fondu(c)}<div class="tx"><b>${n}</b><span class="sub">${s.replace(/^[^·]*· /, "")}</span></div>${compte ? `<span class="compte">${compte}</span>` : ""}<div class="ic">${ROBOT}</div><div class="more">⋯</div></div>`;
tel(`<div class="dk-h"><button class="btn ico">${I.maison}</button><h1>Jouer</h1></div>
  <div class="chips"><button class="btn">＋ Nouveau</button><button class="btn">Importer</button><button class="btn">Imprimer</button><button class="btn">Archives</button></div>
  <div class="sec">MES DECKS</div>
  <div class="liste"><div class="dk newd"><span class="plus">＋</span><span>Créer un deck : choisir un héros Young</span></div></div>
  <div class="sec">DECKS DU BOT</div>
  <div class="liste">${DECKS.map((d, i) => tuileDeck(d, i === 1)).join("")}</div>
  <div class="duel"><div class="bloc">
    <div class="sel2">Deck du bot<b>Au hasard ▾</b></div><div class="sel2">Bot · manches<b>B3 · 2 gagnantes ▾</b></div>
    <button class="btn pri">Jouer avec Hala</button></div></div>`,
  "2. Jouer : tuiles longues (66 points), visage du héros à gauche, nom, sous-titre, pastilles, ⋯ pour les actions. Le choix du bot et le bouton Jouer restent en bas, sous le pouce.");

// ---------- partie : morceaux ----------
const VOUS = { heros: "FR_MPW004", tete: "FR_SBL004", torse: "FR_MPW014", bras: "FR_SBL007", jambes: "FR_PEN047", arme: "FR_MPW005" };
const BOT = { nom: "Dorinthea", heros: "FR_SDO001", tete: "FR_SBL004", torse: "FR_PEN045", bras: "FR_SBL007", jambes: "FR_SAT009", arme: "FR_DTD205" };
const DROMAI = { nom: "Dromai", heros: "UPR002", tete: "FR_PEN123", torse: "FR_PEN253", bras: "FR_SAT008", jambes: "FR_OMN208", arme: "DRO004" };
// Permanents d'exemple pour Dromai (illusionniste) : jetons Ash regroupés, dragons.
const PERMS_DROMAI = [["DRO002", 4], ["UPR010_BACK", 1], ["UPR011_BACK", 1], ["UPR013_BACK", 1]];
const zc = (lib, code, extra = "") => `<div class="z">${code ? C(code) : `<span class="lib">${lib}</span>`}${extra}</div>`;
function tapis(j, bot, o = {}) {
  const pitch = (o.pitch || []).length ? `<div class="z"><div class="pitchf">${o.pitch.map((c, i) => C(c, "", `left:${i * 6}px;top:${i * 3}px`)).join("")}</div><span class="n">${o.pitch.length}</span></div>` : zc("Pitch");
  const cim = o.cim ? `<div class="z">${C(o.cim)}<span class="n">${o.ncim}</span></div>` : `<div class="z"><span class="lib">Cimetière</span><span class="n">0</span></div>`;
  const deck = `<div class="z"><div class="c dos" style="position:absolute;inset:0"></div><span class="n">${o.deck}</span></div>`;
  const ban = `<div class="z"><span class="lib">Banni</span><span class="n">0</span></div>`;
  const heros = `<div class="z heros${o.prio ? " prio" : ""}">${C(j.heros)}<span class="pv">${o.pv}</span></div>`;
  const ars = o.ars ? `<div class="z">${o.ars === "dos" ? '<div class="c dos" style="position:absolute;inset:0"></div>' : C(o.ars)}</div>` : zc("Arsenal");
  const rien = '<div class="z rien"></div>';
  const lib2 = j.offhand ? "Off-hand" : "Arme";
  // Vous : rangée du haut = côté chaîne. Le bot : tapis tourné (rangées et colonnes inversées).
  const eqH = [zc("Tête", j.tete), zc("Torse", j.torse)], eqB = [zc("Bras", j.bras), zc("Jambes", j.jambes)];
  const mH = [zc("Arme", j.arme), heros, zc(lib2, j.arme2)], mB = [rien, ars, rien];
  const pH = [cim, ban], pB = [pitch, deck];
  if (!bot) return `<div class="tapis"><div class="g2">${eqH.join("") + eqB.join("")}</div><div class="g3">${mH.join("") + mB.join("")}</div><div class="g2">${pH.join("") + pB.join("")}</div></div>`;
  return `<div class="tapis bot"><div class="g2">${eqB.reverse().join("") + eqH.reverse().join("")}</div><div class="g3">${mB.reverse().join("") + mH.reverse().join("")}</div><div class="g2">${pB.reverse().join("") + pH.reverse().join("")}</div></div>`;
}
// Permanents : les exemplaires identiques sont regroupés (×N) ; au-delà de la place, « +N » ouvre la liste.
function perms(L, max) {
  if (!L.length) return '<div class="perms"><div class="aucun">aucun permanent</div></div>';
  const vis = L.length > max ? L.slice(0, max - 1) : L;
  return `<div class="perms">${vis.map(([c, n]) => `<div class="pc">${C(c)}${n > 1 ? `<span class="x">×${n}</span>` : ""}</div>`).join("")}${L.length > max ? `<div class="plus">+${L.length - vis.length}</div>` : ""}</div>`;
}
const fxs = (L) => `<span class="fxs">${L.length ? L.map(([t, mal]) => `<span class="fx${mal ? " mal" : ""}">${t}</span>`).join("") : '<span class="fx">aucun effet</span>'}</span>`;
const etat = (r, ap, apmax, extra = "") => `<div class="etat"><span class="g"><span class="res">${r}</span></span><span class="g">${Array.from({ length: Math.max(1, apmax) }, (_, i) => `<span class="ap${i < ap ? "" : " off"}"></span>`).join("")}</span>${extra}</div>`;
const barre = (adv = "Dorinthea") => `<div class="barre"><button class="btn ico">${I.menu}</button><div class="sc">Hala <b>0–0</b> ${adv}<br><span style="color:var(--muted)">Manche 1 · 2 manches gagnantes</span></div><button class="btn ico">${I.journal}</button></div>`;
const ETP = ["Layer", "Attaque", "Défense", "Réactions", "Dégâts", "Résolution"];
const etapes = (r) => `<div class="etapes">${ETP.map((t, k) => `<span class="${k === r ? "on" : k < r ? "done" : ""}">${t}</span>`).join("")}</div>`;
const MAIN = ["FR_SBZ009", "FR_HVY111", "FR_MPW105", "FR_AKO009"];
const main = (cls = [], L = MAIN) => `<div class="main">${L.map((c, i) => C(c, cls[i] || "")).join("")}</div>`;

function partie({ centre, ruban, mainCls, prioVous, prioBot, pitchBot, apV = 1, mainL = MAIN, bot = BOT, permsBot = [], permsVous = [], fxBot = [], fxVous = [], mainBot = 1 }) {
  return `<div class="p">${barre(bot.nom)}
    ${etat(0, 0, 1, fxs(fxBot))}
    <div class="rangee bot">${perms(permsBot, 8)}<div class="mainbot2">Main ${mainBot}<span class="dosm">${'<i class="dos"></i>'.repeat(Math.min(mainBot, 4))}</span></div></div>
    ${tapis(bot, true, { pv: 20, deck: 36, pitch: pitchBot, prio: prioBot })}
    <div class="centre">${centre}</div>
    ${tapis(VOUS, false, { pv: 20, deck: 36, prio: prioVous })}
    ${etat(0, apV, 1, `<span>Main ${mainL.length}</span>` + fxs(fxVous))}
    <div class="rangee">${main(mainCls, mainL)}${perms(permsVous, 6)}</div>
    <div class="ruban">${ruban}</div></div>`;
}

// ---------- 3. Partie : votre tour ----------
const centreVide = `<div class="ticker"><span class="t">Tour 2</span><span class="der">Le bot passe. Votre tour commence.</span></div>
  <div class="etapes"><span class="on">Votre tour · phase d'action</span></div><div class="chainevide">CHAÎNE FERMÉE</div>`;
tel(partie({ centre: centreVide, prioVous: true, mainCls: ["jouable", "jouable", "jouable", "jouable"], bot: DROMAI, permsBot: PERMS_DROMAI, mainBot: 4, fxVous: [["Lame du zénith : marqueur +1", 0]],
  ruban: `<div class="q">À vous de jouer : touchez une carte ou une arme.</div><div class="bs"><button class="btn ico">${I.annuler}</button><button class="btn">Passer</button></div>` }),
  "3. Partie contre Dromai : héros au centre entre ses deux armes, arsenal dessous. Permanents regroupés (×4 pour les jetons identiques) : à droite de votre main pour vous, sur une ligne au-dessus du tapis pour le bot. Effets en cours dans la ligne d'état.");

// ---------- 4. Partie : défense ----------
const centreDef = `<div class="ticker"><span class="t">Tour 1</span><span class="der">Le bot joue Avoir l'air coriace (rouge), pitche 2 cartes.</span></div>${etapes(2)}
  <div class="chaine"><div class="maillon">${C("FR_SBZ010", "att")}<div class="clash"><small>ATTAQUE</small><b class="a">8</b><hr><b class="d">2</b><small>DÉFENSE</small></div><div class="defs">${C("FR_AKO009", "tente")}</div></div>
  <div class="pile"><span class="lab">PILE</span><div class="chainevide" style="font-size:11px">vide</div></div></div>`;
tel(partie({ centre: centreDef, prioVous: true, pitchBot: ["FR_SEA226", "DYN084"], mainCls: ["jouable", "jouable", "jouable"], mainL: MAIN.slice(0, 3),
  ruban: `<div class="q">Défendre : <b>8</b> contre <b>2</b>, vous subissez <b>6</b>.</div><div class="bs"><button class="btn ico">${I.annuler}</button><button class="btn">Ne pas bloquer</button><button class="btn pri">Bloquer avec 1 carte</button></div>` }),
  "4. Partie, défense : vous touchez les cartes pour les poser en bloqueur (contour bleu), le décompte se met à jour, puis vous validez en bas.");

// ---------- 5. Carte en grand ----------
tel(partie({ centre: centreVide, prioVous: true, mainCls: ["", "", "", "jouable leve"],
  ruban: `<div class="q">À vous de jouer.</div><div class="bs"><button class="btn">Passer</button></div>` }) +
  `<div class="voile"></div><div class="fiche"><div class="poignee"></div>${C("FR_AKO009", "grande")}
   <h3>Humilier (rouge)</h3><div class="ty">Générique · Action, Attaque · coût 2 · puissance 6 · défense 2</div>
   <div class="txt">Quand cette carte touche un héros, il perd toutes ses capacités de carte de héros jusqu'à la fin de son prochain tour.</div>
   <div class="bs"><button class="btn pri">Jouer</button><button class="btn">Fermer</button></div></div>`,
  "5. Carte en grand : appui long sur n'importe quelle carte (la vôtre, celle du bot, une carte de la chaîne…). La fiche monte du bas, avec le texte officiel et, si c'est votre carte, ses actions.");

// ---------- 6. Journal ----------
tel(partie({ centre: centreDef, pitchBot: ["FR_SEA226", "DYN084"], mainCls: [],
  ruban: `<div class="q">Défendre : <b>8</b> contre <b>0</b>, vous subissez <b>8</b>.</div><div class="bs"><button class="btn">Ne pas bloquer</button></div>` }) +
  `<div class="voile"></div><div class="tiroir"><div class="hd"><h3>Journal</h3><button class="btn ico" style="border:0;background:none">${I.fermer}</button></div>
   <div class="corps"><div class="tr">TOUR 1 · LE BOT</div>
   <p class="bot">Le bot pitche Sirens of Safe Harbor (rouge).</p><p class="bot">Le bot pitche Felling Swing (bleu).</p>
   <p class="bot">Le bot joue Look Tuff (rouge).</p><p class="bot">Attaque : Look Tuff (rouge), 8 de puissance.</p></div>
   <div class="pied"><button class="btn">${I.annuler} Annuler mon dernier choix</button></div></div>`,
  "6. Journal : bouton en haut à droite, il glisse depuis la droite. La dernière ligne reste toujours visible en haut de la chaîne.");

// ---------- 7. Menu ----------
tel(partie({ centre: centreVide, prioVous: true, mainCls: ["jouable", "jouable", "jouable", "jouable"],
  ruban: `<div class="q">À vous de jouer : touchez une carte ou une arme.</div><div class="bs"><button class="btn ico">${I.annuler}</button><button class="btn">Passer</button></div>` }) +
  `<div class="voile" style="background:rgb(5 7 10 / .45)"></div><div class="menu">
   <button class="btn">${I.maison} Accueil</button><hr>
   <button class="btn">Conseil du bot</button><button class="btn">Bot contre Bot</button><button class="btn">Options d'affichage</button><hr>
   <button class="btn">Signaler un bug</button><button class="btn">Exporter la partie</button><button class="btn">Importer une partie</button><hr>
   <button class="btn">Nouveau match</button><button class="btn" style="color:var(--red)">Abandonner</button></div>`,
  "7. Menu de la partie (☰ en haut à gauche) : tout ce qui était dans la colonne de droite du PC.");

document.getElementById("planche").innerHTML = ecrans.join("");
</script>
</body>
</html>
